# Production override — extends base (Redis runs in-compose, Postgres is external)
# Use: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  backend:
    ports: []
    expose:
      - "8080"
    networks:
      - PantioNetwork
      - npm_default
  frontend:
    ports: []
    expose:
      - "80"
    networks:
      - PantioNetwork
      - npm_default
  redis:
    ports:
      - "6379:6379"
    networks:
      - PantioNetwork
      - npm_default

networks:
  npm_default:
    external: true
