trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:
  - stage: Backend
    displayName: Backend — Build & Test
    jobs:
      - job: BuildAndTest
        displayName: .NET 10 build + NUnit tests
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 10
            inputs:
              version: 10.x

          - script: dotnet restore backend/Pantio.slnx
            displayName: Restore NuGet packages

          - script: dotnet build backend/Pantio.slnx --no-restore -c Release
            displayName: Build solution

          - script: >
              dotnet test backend/Pantio.slnx --no-build -c Release
              --collect:"XPlat Code Coverage"
              --results-directory $(Agent.TempDirectory)/TestResults
              --logger trx
            displayName: Run tests

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage
            condition: always()
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'

  - stage: Frontend
    displayName: Frontend — Build
    dependsOn: []
    jobs:
      - job: Build
        displayName: Vue 3 TypeScript build
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            displayName: Use Node LTS
            inputs:
              versionSpec: lts/*

          - script: npm ci
            displayName: Install dependencies
            workingDirectory: frontend/PantioApp

          - script: npm run build
            displayName: Build (vue-tsc + vite)
            workingDirectory: frontend/PantioApp
