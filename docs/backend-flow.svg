<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540"
     font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="540" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a" letter-spacing="0.3">Backend — Request Flow</text>
  <line x1="40" y1="46" x2="780" y2="46" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Response label -->
  <text x="36" y="120" font-size="9" fill="#cbd5e1" font-style="italic">↑ response</text>

  <!-- ══ MAIN FLOW ══ -->

  <!-- 1. HTTPS Request -->
  <rect x="40" y="56" width="340" height="50" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="210" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">HTTPS Request</text>
  <text x="210" y="94" text-anchor="middle" font-size="11" fill="#94a3b8">Client → REST / JSON</text>
  <line x1="210" y1="106" x2="210" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. JWT Auth Middleware -->
  <rect x="40" y="128" width="340" height="50" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="210" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">Auth0 · JWT Middleware</text>
  <text x="210" y="166" text-anchor="middle" font-size="11" fill="#ea580c">Validates Bearer token · returns 401 if invalid</text>
  <line x1="210" y1="178" x2="210" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. Controller -->
  <rect x="40" y="200" width="340" height="50" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="210" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">ASP.NET Core Controller</text>
  <text x="210" y="238" text-anchor="middle" font-size="11" fill="#3b82f6">Routes request · validates input · returns HTTP result</text>
  <line x1="210" y1="250" x2="210" y2="272" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4. Service Layer -->
  <rect x="40" y="272" width="340" height="50" rx="9" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="210" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">Service Layer</text>
  <text x="210" y="310" text-anchor="middle" font-size="11" fill="#22c55e">Business logic · Redis cache · external API calls</text>
  <line x1="210" y1="322" x2="210" y2="354" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5. Repository -->
  <rect x="40" y="354" width="340" height="50" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="210" y="374" text-anchor="middle" font-size="13" font-weight="600" fill="#4338ca">Repository Layer</text>
  <text x="210" y="392" text-anchor="middle" font-size="11" fill="#6366f1">EF Core 10 · query and persist data</text>
  <line x1="210" y1="404" x2="210" y2="426" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 6. PostgreSQL -->
  <rect x="40" y="426" width="340" height="50" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="210" y="446" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">PostgreSQL</text>
  <text x="210" y="464" text-anchor="middle" font-size="11" fill="#d97706">Primary database · all persistent state</text>

  <!-- ══ EXTERNAL API CALLS ══ -->
  <rect x="420" y="200" width="360" height="196" rx="9" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="440" y="220" font-size="9" font-weight="700" fill="#7e22ce" letter-spacing="2">EXTERNAL API CALLS</text>
  <text x="440" y="236" font-size="10" fill="#9333ea" font-style="italic">Outbound from Service Layer</text>

  <rect x="440" y="244" width="148" height="26" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="514" y="262" text-anchor="middle" font-size="12" fill="#6b21a8">Gemini 2.5 Flash</text>
  <text x="595" y="262" font-size="9" fill="#a78bfa">Recipe generation</text>

  <rect x="440" y="278" width="148" height="26" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="514" y="296" text-anchor="middle" font-size="12" fill="#6b21a8">Open Food Facts</text>
  <text x="595" y="296" font-size="9" fill="#a78bfa">EAN lookup · contribute</text>

  <rect x="440" y="312" width="148" height="26" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="514" y="330" text-anchor="middle" font-size="12" fill="#6b21a8">Netto Receipt API</text>
  <text x="595" y="330" font-size="9" fill="#a78bfa">OAuth · receipt import</text>

  <rect x="440" y="346" width="148" height="26" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="514" y="364" text-anchor="middle" font-size="12" fill="#6b21a8">Firebase FCM</text>
  <text x="595" y="364" font-size="9" fill="#a78bfa">Push notifications</text>

  <!-- Arrow: Service Layer → External box -->
  <line x1="380" y1="297" x2="420" y2="297" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-p)"/>

  <!-- ══ BACKGROUND JOBS ══ -->
  <rect x="420" y="412" width="360" height="82" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="440" y="432" font-size="9" font-weight="700" fill="#64748b" letter-spacing="2">BACKGROUND JOBS</text>
  <text x="440" y="448" font-size="10" fill="#94a3b8" font-style="italic">Scheduled · no inbound request needed</text>

  <rect x="440" y="454" width="132" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="506" y="472" text-anchor="middle" font-size="12" fill="#475569">Expiry Check</text>

  <rect x="584" y="454" width="152" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="472" text-anchor="middle" font-size="12" fill="#475569">Netto Auto-Sync</text>

  <!-- Footer -->
  <line x1="40" y1="510" x2="780" y2="510" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="528" text-anchor="middle" font-size="11" fill="#94a3b8">Pantio Backend · .NET 10 · ASP.NET Core</text>

</svg>
