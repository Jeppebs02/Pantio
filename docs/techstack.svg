  <text x="38" y="81" font-size="9" font-weight="700" fill="#60a5fa" letter-spacing="2.2">CLIENT</text>

  <rect x="38" y="88" width="80" height="26" rx="6" fill="#0f2545" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.55"/>
