  </pattern>
  <rect width="820" height="648" rx="16" fill="url(#dots)"/>

  <!-- Title bar -->
  <text x="410" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9" letter-spacing="0.4">Pantio — Tech Stack</text>
  <line x1="40" y1="52" x2="780" y2="52" stroke="#1e293b" stroke-width="1"/>

  <!-- ═══ CLIENT ═══ -->
