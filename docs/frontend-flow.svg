<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500"
     font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arr-l" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#94a3b8"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="500" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a" letter-spacing="0.3">Frontend — Application Flow</text>
  <line x1="40" y1="46" x2="780" y2="46" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ══ CENTER FLOW ══ -->

  <!-- 1. Vue Router -->
  <rect x="260" y="58" width="300" height="50" rx="9" fill="#f5f5f5" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="410" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#404040">Vue Router 4</text>
  <text x="410" y="96" text-anchor="middle" font-size="11" fill="#737373">Route matching · navigation guards · lazy loading</text>
  <line x1="410" y1="108" x2="410" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. View + Components -->
  <rect x="260" y="130" width="300" height="60" rx="9" fill="#f0f0f0" stroke="#c4c4c4" stroke-width="1.5"/>
  <text x="410" y="151" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">View + Components</text>
  <text x="410" y="168" text-anchor="middle" font-size="11" fill="#525252">Vue 3.5 · TypeScript · composition API</text>
  <text x="410" y="183" text-anchor="middle" font-size="10" fill="#9ca3af">Reads store state · dispatches store actions</text>
  <line x1="410" y1="190" x2="410" y2="212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. Pinia Store -->
  <rect x="260" y="212" width="300" height="50" rx="9" fill="#ebebeb" stroke="#c0c0c0" stroke-width="1.5"/>
  <text x="410" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Pinia Store</text>
  <text x="410" y="250" text-anchor="middle" font-size="11" fill="#525252">recipes · inventory · auth · shopping · store</text>
  <line x1="410" y1="262" x2="410" y2="284" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4. API Service -->
  <rect x="260" y="284" width="300" height="50" rx="9" fill="#e8e8e8" stroke="#bcbcbc" stroke-width="1.5"/>
  <text x="410" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">API Service · apiFetch</text>
  <text x="410" y="322" text-anchor="middle" font-size="11" fill="#4a4a4a">REST / JSON · Auth0 JWT in Authorization header</text>
  <line x1="410" y1="334" x2="410" y2="376" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- 5. Backend API -->
  <rect x="260" y="376" width="300" height="50" rx="9" fill="#f5f5f5" stroke="#d4d4d4" stroke-width="1.5"/>
  <text x="410" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="#404040">Backend API</text>
  <text x="410" y="414" text-anchor="middle" font-size="11" fill="#9ca3af">.NET 10 · HTTPS · JSON response</text>

  <!-- Dashed line label -->
  <rect x="418" y="349" width="72" height="14" rx="3" fill="#ffffff"/>
  <text x="454" y="360" text-anchor="middle" font-size="9" fill="#9ca3af">network call</text>

  <!-- ══ AUTH0 (left) ══ -->
  <rect x="30" y="284" width="210" height="50" rx="9" fill="#f2f2f2" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="135" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">Auth0</text>
  <text x="135" y="322" text-anchor="middle" font-size="11" fill="#737373">JWT stored in memory</text>

  <!-- Arrow: Auth0 → API Service -->
  <line x1="240" y1="309" x2="260" y2="309" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <rect x="238" y="294" width="24" height="12" rx="2" fill="#ffffff"/>
  <text x="250" y="304" text-anchor="middle" font-size="8" fill="#737373">token</text>

  <!-- ══ CAPACITOR (right) ══ -->
  <rect x="590" y="130" width="200" height="130" rx="9" fill="#f5f5f5" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="690" y="150" text-anchor="middle" font-size="9" font-weight="700" fill="#525252" letter-spacing="2">CAPACITOR 6</text>
  <text x="690" y="165" text-anchor="middle" font-size="10" fill="#737373" font-style="italic">Native device access</text>

  <rect x="608" y="172" width="164" height="26" rx="6" fill="#e5e5e5" stroke="#d4d4d4" stroke-width="1"/>
  <text x="690" y="190" text-anchor="middle" font-size="12" fill="#404040">Camera · Barcode</text>

  <rect x="608" y="206" width="164" height="26" rx="6" fill="#e5e5e5" stroke="#d4d4d4" stroke-width="1"/>
  <text x="690" y="224" text-anchor="middle" font-size="12" fill="#404040">Push Notifications</text>

  <!-- Arrow: Capacitor → View -->
  <line x1="590" y1="160" x2="560" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-l)"/>
  <rect x="556" y="145" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="574" y="155" text-anchor="middle" font-size="8" fill="#9ca3af">result</text>

  <!-- ══ LEGEND note for dashed line ══ -->
  <text x="410" y="448" text-anchor="middle" font-size="10" fill="#9ca3af" font-style="italic">Dashed arrow = crosses network boundary</text>

  <!-- Footer -->
  <line x1="40" y1="462" x2="780" y2="462" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="480" text-anchor="middle" font-size="11" fill="#94a3b8">Pantio Frontend · Vue 3.5 · TypeScript · Vite 8</text>

</svg>
