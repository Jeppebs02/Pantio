services:
  backend:
    container_name: backend
    build:
      context: ./backend/PantioAPI
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HOST_PORT}:8080"
    networks:
      - PantioNetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START_PERIOD}

  # frontend:
  #   TODO: Add frontend service here once it exists. Remember to give the service and container_name the same name.
  #   It should also be added to PantioNetwork so it can reach the backend.

networks:
  PantioNetwork:
    driver: bridge
