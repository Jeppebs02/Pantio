services:
  backend:
    container_name: backend
    build:
      context: ./backend/PantioAPI
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    networks:
      - PantioNetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # frontend:
  #   TODO: Add frontend service here once it exists. Remember to give the service and container_name the same name.
  #   It should also be added to PantioNetwork so it can reach the backend.

networks:
  PantioNetwork:
    driver: bridge
