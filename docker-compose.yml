services:
  backend:
    container_name: backend
    build:
      context: ./backend/PantioAPI
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - PantioNetwork
    environment:
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - Auth0__Authority=${AUTH0__AUTHORITY}
      - Auth0__Audience=${AUTH0__AUDIENCE}
      - Auth0__ManagementDomain=${AUTH0__MANAGEMENT_DOMAIN}
      - Auth0__ManagementClientId=${AUTH0__MANAGEMENT_CLIENT_ID}
      - Auth0__ManagementClientSecret=${AUTH0__MANAGEMENT_CLIENT_SECRET}
      - Auth0__RegistrationSecret=${AUTH0__REGISTRATION_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START_PERIOD}

  frontend:
    container_name: frontend
    build:
      context: ./frontend/PantioApp
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    networks:
      - PantioNetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START_PERIOD}

  postgres:
    profiles: ["dev"]
    image: postgres:17-alpine
    container_name: postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - PantioNetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  PantioNetwork:
    driver: bridge

volumes:
  postgres_dev_data:
