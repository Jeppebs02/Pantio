services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: PantioAPI/Dockerfile
    ports:
      - "${BACKEND_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - PantioNetwork
    environment:
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - Redis__ConnectionString=redis:6379
      - Gemini__ApiKey=${Gemini__ApiKey}
      - Auth0__Authority=${AUTH0__AUTHORITY}
      - Auth0__Audience=${AUTH0__AUDIENCE}
      - Auth0__ManagementDomain=${AUTH0__MANAGEMENT_DOMAIN}
      - Auth0__ManagementClientId=${AUTH0__MANAGEMENT_CLIENT_ID}
      - Auth0__ManagementClientSecret=${AUTH0__MANAGEMENT_CLIENT_SECRET}
      - Auth0__RegistrationSecret=${AUTH0__REGISTRATION_SECRET}
      - TokenEncryption__Key=${TokenEncryption__Key}
      - Firebase__ProjectId=${Firebase__ProjectId}
      - Netto__ClientId=${VITE_NETTO_CLIENT_ID}
      - Netto__RedirectUri=${VITE_NETTO_REDIRECT_URI}
      - Netto__TokenEndpoint=https://idp.dsgapps.dk/token
      - Netto__ReceiptListEndpoint=https://p-club.dsgapps.dk/api/cp/receipt
      - Netto__ReceiptDetailEndpoint=https://p-club.dsgapps.dk/api/cp/receipt/details
    volumes:
      - ./backend/PantioAPI/firebase-service-account.json:/app/firebase-service-account.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START_PERIOD}

  frontend:
    container_name: frontend
    build:
      context: ./frontend/PantioApp
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GIGYA_API_KEY: ${VITE_GIGYA_API_KEY}
        VITE_GIGYA_BASE_URL: ${VITE_GIGYA_BASE_URL}
        VITE_NETTO_AUTHORIZE_URL: ${VITE_NETTO_AUTHORIZE_URL}
        VITE_NETTO_CLIENT_ID: ${VITE_NETTO_CLIENT_ID}
        VITE_NETTO_REDIRECT_URI: ${VITE_NETTO_REDIRECT_URI}
        VITE_NETTO_TENANT_ID: ${VITE_NETTO_TENANT_ID}
        VITE_NETTO_CHANNEL: ${VITE_NETTO_CHANNEL}
        VITE_NETTO_CLIENT_FLOW: ${VITE_NETTO_CLIENT_FLOW}
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    networks:
      - PantioNetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START_PERIOD}

  redis:
    profiles: ["dev"]
    image: redis:7-alpine
    container_name: redis_dev
    ports:
      - "6379:6379"
    networks:
      - PantioNetwork
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    profiles: ["dev"]
    image: postgres:17-alpine
    container_name: postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - PantioNetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  PantioNetwork:
    driver: bridge

volumes:
  postgres_dev_data:
